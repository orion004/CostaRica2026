name: Encrypt and Deploy Itinerary to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Costa_Rica_2026_Family_Itinerary.html'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encrypt HTML with Pagecrypt
        run: |
          npx pagecrypt Costa_Rica_2026_Family_Itinerary.html index.html "${{ secrets.PAGE_PASSWORD }}"

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
