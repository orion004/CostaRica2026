<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=fd16e688-8248-4459-a143-d3f6cb95fee0
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Password Protected Page</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }
        #dialogText {
            color: #000000;
            font-size: 24px;
            line-height: 30px;
            margin-top: 20px;
            font-weight: bold;
        }

        #dialogWrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: table;
            background-color: #FFFFFF;
        }

        #dialogWrapCell {
            display: table-cell;
            text-align: center;
            vertical-align: middle;
        }

        #mainDialog {
          max-width: 400px;
          border: 3px solid #c4bae5;
          margin-left: auto;
          margin-right: auto;
          background-color: #FFFFFF;
          overflow: hidden;
          text-align: left;
          padding: 30px 44px;
        }

        #passArea {

        }
        #pass {
          width: 100%;
          margin-top: 24px;
          margin-bottom: 22px;
          padding: 20px 0px;
          border-style: none solid solid none;
          border-width: 0px 0px 2px;
          border-color: #dcd6fc;
          background-color: hsla(0, 0%, 100%, 0);
          color: #282828;
          font-size: 18px;
          line-height: 1.5;
          outline: none;
        }
          #pass:hover {
            border-color: #4c4cfc;
          }
          #pass:focus {
            border-color: #fc5567;
            color: #4c4cfc;
          }

        #messageWrapper {
            vertical-align: middle;
            line-height: 30px;
        }

        .notifyText {
            display: none;
        }

        #invalidPass {
            color: #fc5567;
        }

        #success {
            color: #4c4cfc;
        }

        #submitPass {
          display: inline-block;
          padding: 9px 15px;
          margin: 0 15px 0 0;
          line-height: inherit;
          text-decoration: none;
          cursor: pointer;
          border-radius: 0;
          border: 3px solid #4c4cfc;
          background-color: transparent;
          color: #4c4cfc;
          font-size: 16px;
          font-weight: bold;
        }
          #submitPass:hover {
            background: #4c4cfc;
            color: #FFFFFF;
          }
        .p-small {
          margin-top: 34px;
          color: #a9a9a9;
          font-size: 14px;
        }
          .p-small>a {
            color: #4c4cfc;
            text-decoration: none;
          }
            .p-small>a:hover {
              color: #fc5567;
            }
        #contentFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
  </head>
  <body>
    <iframe id="contentFrame" frameBorder="0" allowfullscreen></iframe>
    <div id="dialogWrap">
        <div id="dialogWrapCell">
            <div id="mainDialog">
                <div id="dialogText">This page is password protected.</div>
                <div id="passArea">
                    <input id="pass" type="password" name="pass" placeholder="You password please...">
                    <div>
                        <button id="submitPass" type="button">Login with Credentials</button>
                        <span id="messageWrapper">
                            <span id="invalidPass" class="notifyText">Hmm, that did not go as planned.</span>
                            <span id="success" class="notifyText">Everything checks out!</span>
                            &nbsp;
                        </span>
                    </div>
                </div>
                <p class="p-small">By login into this page you are accepting the terms and conditions of the following <a href="../../legal/non-disclosure-agreement.html" target="_blank" class="p-small-link">Non Disclousre Form</a>.</p>
            </div>
        </div>
    </div>

        var submitPass = document.getElementById('submitPass');
        var passEl = document.getElementById('pass');
        var invalidPassEl = document.getElementById('invalidPass');
        var successEl = document.getElementById('success');
        var contentFrame = document.getElementById('contentFrame');

        if (pl === "") {
            submitPass.disabled = true;
            passEl.disabled = true;
            alert("This page is meant to be used with the encryption tool. It doesn't work standalone.");
        }

        function doSubmit(evt) {
            try {
                var decrypted = decryptFile(CryptoJS.enc.Base64.parse(pl.data), passEl.value, CryptoJS.enc.Base64.parse(pl.salt), CryptoJS.enc.Base64.parse(pl.iv));
                if (decrypted === "") throw "No data returned";

                // Set default iframe link targets to _top so all links break out of the iframe
                decrypted = decrypted.replace("<head>", "<head><base href=\".\" target=\"_top\">");

                srcDoc.set(contentFrame, decrypted);

                successEl.style.display = "inline";
                passEl.disabled = true;
                submitPass.disabled = true;
                setTimeout(function() {
                    dialogWrap.style.display = "none";
                }, 1000);
            } catch (e) {
                invalidPassEl.style.display = "inline";
                passEl.value = "";
            }
        }

        submitPass.onclick = doSubmit;
        passEl.onkeypress = function(e){
            if (!e) e = window.event;
            var keyCode = e.keyCode || e.which;
            invalidPassEl.style.display = "none";
            if (keyCode == '13'){
              // Enter pressed
              doSubmit();
              return false;
            }
        }

        function decryptFile(contents, password, salt, iv) {
            var _cp = CryptoJS.lib.CipherParams.create({
                ciphertext: contents
            });
            var key = CryptoJS.PBKDF2(password, salt, { keySize: 256/32, iterations: 100 });
            var decrypted = CryptoJS.AES.decrypt(_cp, key, {iv: iv});

            return decrypted.toString(CryptoJS.enc.Utf8);
        }
